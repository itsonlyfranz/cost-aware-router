[project]
name = "cost-aware-router"
version = "0.1.0"
description = "Cost-aware agent router: per-task token budgets, complexity-based model routing, confidence early exit, and cost-per-decision analytics."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
car = "cost_aware_router.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cost_aware_router"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
